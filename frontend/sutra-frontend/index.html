  <head>
  <script>
    // PWA Standalone Trap: Bypasses manifest routing issues.
    // If the app is launched from the Android Home Screen, it forces the /mobile route.
    if (window.matchMedia('(display-mode: standalone)').matches) {
      if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
        window.location.replace('/mobile');
      }
    }
  </script>

</head>
</html>
